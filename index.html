<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>gerenciador de videogame</title>
</head>
<body>

    <div class="logos">
        <img class="play" src="img/playstation.png" alt="Playstation">
        <img class="nintendo" src="img/nintendo.png" alt="Nintendo" >
        <img class="xbox" src="img/xbox.png" alt="Xbox">
        <h1>Gerenciador de Videogame</h1>
    </div>

    <div class="pai">
        <div class="box">
            <p>Cadastra Videogame+</p>
            <button onclick="cadastrar()">Clique aqui</button>
        </div>

        <div class="meio">
            <p>Listar Videogames</p>
            <button onclick="listar()">Clique aqui</button>
        </div>

        <div class="box">
            <p>Buscar por Videogames</p>
            <button onclick="buscar()">Clique aqui</button>
        </div>

        <div class="box">
            <p>Remover último Videogame</p>
            <button onclick="deletar()">Clique aqui</button>
        </div>

        <div class="meio">
            <p>deletar Videogame pelo ID</p>
            <button onclick="remiverId()">Clique aqui</button>
        </div>

        <div class="box">
            <p>Limpar tudo</p>
            <button onclick="limparTudo()">Clique aqui</button>
        </div>

        <div class="box">
            <p>Exibir total de Videogames</p>
            <button onclick="exibirConsoles()">Clique aqui</button>
        </div>
        
    </div>
    
</body>
<script src="scirpt.js"></script>
</html>
